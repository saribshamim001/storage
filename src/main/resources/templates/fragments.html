<!-- templates/fragments.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="html_head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VenuMate</title>
    <!-- 🎨 Favicon -->
    <link rel="icon" type="image/png" href="/images/venuMateIcon.png">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/headerFooter.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<header th:fragment="header" class="site-header">
    <h1 class="site-title">
        <a href="/venues" class="site-link">--- VenuMate ---</a>
    </h1>
</header>
<!-- fragments.html -->
<div th:fragment="page_loader">
    <div id="pageLoader" class="page-loader">
        <div class="spinner"></div>
    </div>
</div>
<div th:fragment="notifications">
    <script th:if="${successMessage != null}">
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });

        Toast.fire({
            icon: 'success',
            title: [[${successMessage}]]
        });
    </script>

    <script th:if="${errorMessage != null}">
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });

        Toast.fire({
            icon: 'error',
            title: [[${errorMessage}]]
        });
    </script>

    <script th:if="${warningMessage != null}">
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });

        Toast.fire({
            icon: 'warning',
            title: [[${warningMessage}]]
        });
    </script>
</div>

<footer th:fragment="footer" class="site-footer">
    <p>&copy; 2025 VenuMate. All rights reserved.</p>
</footer>
</body>
</html>
