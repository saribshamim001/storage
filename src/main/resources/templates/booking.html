<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Venue</title>
    <th:block th:insert="fragments :: html_head"></th:block>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/booking.css">
</head>
<body>
<div th:insert="fragments :: page_loader"></div>
<div th:replace="fragments :: header"></div>

<main>
    <div class="booking-form-container">

        <form id="bookingForm" action="/book-venue" method="post">

            <h2>Venue: <span id="venueNameDisplay"></span></h2>

            <!-- Capacity -->
            <label for="capacity">Capacity</label>
            <input type="text" id="capacity" name="capacity" readonly>
            <span id="capacityError" class="error-message"></span>

            <!-- Date -->
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
            <span id="dateError" class="error-message"></span>

            <!-- Time Slot -->
            <label for="timeSlot">Time Slot</label>
            <select id="timeSlot" name="timeSlot" required>
                <option value="">-- Select Time Slot --</option>
                <option>Morning (9AM - 12PM)</option>
                <option>Afternoon (1PM - 4PM)</option>
                <option>Evening (5PM - 9PM)</option>
            </select>
            <span id="timeSlotError" class="error-message"></span>

            <label for="decoration">Decoration Details</label>
            <textarea id="decoration" name="decoration" placeholder="Describe decoration guidelines or options" rows="3" required minlength="5" maxlength="100"></textarea>
            <span class="error-msg" id="decorationError"></span>

            <label for="stage">Stage Details</label>
            <textarea id="stage" name="stage" placeholder="Describe stage setup or options" rows="3" required minlength="5" maxlength="100"></textarea>
            <span class="error-msg" id="stageError"></span>

            <label for="flowers">Flower Arrangements</label>
            <textarea id="flowers" name="flowers" placeholder="Describe flower arrangement options" rows="3" required minlength="5" maxlength="100"></textarea>
            <span class="error-msg" id="flowersError"></span>

            <!-- Comments -->
            <label for="comments">Other Comments</label>
            <textarea id="comments" name="comments"></textarea>
            <span id="commentsError" class="error-message"></span>

            <!-- Submit button (only for non-admin users) -->
            <div th:if="${session.loggedInUser?.role != 'ADMIN'}">
                <button class="crudVenue" type="submit">Confirm Booking</button>
            </div>

        </form>

    </div>
</main>

<div th:replace="fragments :: footer"></div>

<script src="/js/booking.js"></script>
<script src="/js/page-loader.js"></script>
<script src="/js/form-validation.js"></script>

</body>
</html>
