<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>View Bookings</title>
  <th:block th:insert="fragments :: html_head"></th:block>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/view-bookings.css">
</head>
<body>
<!-- Loader Overlay -->
<div th:insert="fragments :: page_loader"></div>
<div th:replace="fragments :: header"></div>

<main class="view-bookings">
  <section class="bookings-container">
    <h2>📋 All Venue Bookings</h2>

    <input type="hidden" id="bookingCount" th:value="${bookings.size()}" />
    <div class="table-wrapper" th:if="${#lists.size(bookings) > 0}">
      <table class="modern-table">
        <thead>
        <tr>
          <th>#</th>
          <th>🏛️ Venue Name</th>
          <th>📅 Booking Date</th>
          <th>👥 Capacity</th>
          <th>🕒 Time Slot</th>
          <th>🎨 Decoration</th>
          <th>🎭 Stage</th>
          <th>🌺 Flowers</th>
        </tr>
        </thead>
       <tbody>
        <tr th:each="booking, iterStat : ${bookings}">
          <td th:text="${iterStat.count}"></td>
          <td th:text="${booking.name}"></td>
          <td th:text="${booking.bookingDate}"></td>
          <td th:text="${booking.capacity}"></td>
          <td th:text="${booking.timeslot}"></td>
          <td th:text="${booking.decoration}"></td>
          <td th:text="${booking.stage}"></td>
          <td th:text="${booking.flowers}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div th:replace="fragments :: footer"></div>
<script src="/js/page-loader.js"></script>
<script src="/js/view-bookings.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
