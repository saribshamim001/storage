<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Update Venue</title>
    <th:block th:insert="fragments :: html_head"></th:block>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/update-venue.css" />
</head>
<body>
<div th:insert="fragments :: page_loader"></div>
<div class="page-wrapper">
    <div th:replace="fragments :: header"></div>

    <main class="main-content">
        <div class="form-container">
            <h2>Update Venue</h2>

            <form class="venue-form"
                  id="updateVenueForm"
                  th:action="@{'/updateVenue/' + ${venueId}}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Hidden method override for PUT -->
                <input type="hidden" name="_method" value="put">

                <label for="name">Venue Name:</label>
                <input type="text" id="name" name="name" required minlength="5" maxlength="50">

                <label for="capacity">Capacity:</label>
                <input type="number" id="capacity" name="capacity" min="10" max="5000" required>

                <label for="timeslot">Time Slot:</label>
                <select id="timeslot" name="timeslot" required>
                    <option value="" disabled selected>Select a time slot</option>
                    <option value="Morning">Morning (8 AM - 11 PM)</option>
                    <option value="Afternoon">Afternoon (12 PM - 3 PM)</option>
                    <option value="Evening">Evening (4 PM - 7 PM)</option>
                    <option value="Night">Night (8 PM - 01 AM)</option>
                </select>

                <label for="decoration">Decoration:</label>
                <input type="text" id="decoration" name="decoration" required minlength="3" maxlength="100">

                <label for="stage">Stage:</label>
                <input type="text" id="stage" name="stage" required minlength="3" maxlength="100">

                <label for="flowers">Flowers:</label>
                <input type="text" id="flowers" name="flowers" required minlength="3" maxlength="100">

                <!-- ✅ Image Upload Field -->
                <label for="imageFile">Upload Venue Image:</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*" required/>

                <button type="submit" class="submit-btn">Update Venue</button>
            </form>

            <script th:if="${errorMessage != null}">
                alert([[${errorMessage}]]);
            </script>
        </div>
    </main>

    <div th:replace="fragments :: footer"></div>
</div>
<script src="/js/page-loader.js"></script>
<script src="/js/update-venue.js"></script>
<script src="/js/form-validation.js"></script>
</body>
</html>
