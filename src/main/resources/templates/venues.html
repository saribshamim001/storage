<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:insert="fragments :: html_head"></th:block>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/venues.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div th:replace="fragments :: page_loader"></div>
<div th:replace="fragments :: header"></div>
<div th:replace="sidebar :: sidebar"></div>

<div class="page-heading">
    <h1>Our Offerings</h1>
</div>
<!--<div class="search-box">-->
<!--    <input type="text" placeholder="Search by venue name...">-->
<!--    <button>Search</button>-->
<!--</div>-->
<!-- 🔍 Search Bar -->
<div class="search-container"
     th:if="${session.loggedInUser?.role != 'ADMIN'}">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by design name...">
        <button id="searchBtn" onclick="searchVenue()">
            <span id="searchBtnText">Search</span>
            <span id="searchBtnLoader" class="btn-loader" style="display:none;"></span>
        </button>
    </div>
</div>
<!--<main>-->
<!--    <div class="venue-container" id="venueContainer">-->
<!--        &lt;!&ndash; Venues will be inserted here dynamically &ndash;&gt;-->
<!--    </div>-->
<!--</main>-->
<main>
    <div class="venue-container" id="venueContainer">
        <!-- Venues will be inserted here dynamically -->
    </div>
    <!-- 🔹 Pagination -->
    <div class="pagination-container">
        <button id="prevBtn" onclick="prevPage()">⏮ Prev</button>
        <span id="paginationInfo">Loading...</span>
        <button id="nextBtn" onclick="nextPage()">Next ⏭</button>
    </div>
</main>
<div th:if="${successMessage}">
    <script th:inline="javascript">
        const Toast = Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true
        });

        Toast.fire({
            icon: 'success',
            title: /*[[${successMessage}]]*/ ''
        });
    </script>
</div>
<div th:replace="fragments :: footer"></div>
<script src="/js/venues.js"></script>
<script src="/js/page-loader.js"></script>
</body>
</html>
